<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OnInput Example</title>
</head>
<body>
  <input type="text" id="num1" placeholder="First number" oninput="calculateSum()">
  <br><br>
  <input type="text" id="num2" placeholder="Second number" oninput="calculateSum()">

  <br><br>
  <div id="finalsum"></div>

  <script>
    function calculateSum() {
      const element1 = document.getElementById("num1").value;
      const element2 = document.getElementById("num2").value;
      const ans = Number(element1) + Number(element2);
      document.getElementById('finalsum').innerHTML = isNaN(ans) ? "" : ans;
    }
  </script>
</body>
</html>
